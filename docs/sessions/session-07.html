<!DOCTYPE html>
<html lang="en-AU">

<title>Session 7 – ee and ea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg1:#fff4e0;--bg2:#ffe1ec;--ink:#2b2340;--muted:#7a6f8a;--btn:#ff7a45;--btn2:#ff5a7a;--ok:#2fb36d;--line:#e6dcef}

html,body{margin:0;min-height:100%}
body{font-family:Lexend,system-ui,sans-serif;color:var(--ink);font-size:18px;line-height:1.35;
  background:linear-gradient(170deg,var(--bg1),var(--bg2)) fixed}
#app{display:flex;flex-direction:column;min-height:100dvh}
#top{padding:max(10px,env(safe-area-inset-top)) 16px 6px}
#blk{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;min-height:17px}
#bar{height:8px;background:rgba(0,0,0,.08);border-radius:8px;margin-top:6px;overflow:hidden}
#barfill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--btn),var(--btn2));transition:width .3s}
#main{flex:1;padding:8px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#main.top{justify-content:flex-start}
#bottom{position:sticky;bottom:0;padding:10px 16px max(14px,env(safe-area-inset-bottom));background:rgba(255,255,255,.78);
  backdrop-filter:blur(6px);border-top:1px solid var(--line)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1{font-size:28px;margin:0 0 10px;font-weight:800}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:16px}
.count{font-size:15px;color:var(--muted);margin-bottom:10px}
.emoji{font-size:64px;margin-bottom:6px}
.primary{width:100%;min-height:56px;border-radius:16px;color:#fff;font-weight:800;font-size:22px;
  background:linear-gradient(135deg,var(--btn),var(--btn2));box-shadow:0 6px 16px rgba(255,90,122,.3)}
.primary:active{transform:scale(.98)}

.ghost{min-height:48px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:600;font-size:16px;color:var(--muted)}
.word{font-size:52px;font-weight:800;letter-spacing:.02em;margin:10px 0}
.spk{min-width:72px;min-height:72px;border-radius:50%;font-size:34px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);margin:6px 0 14px}
.spk:active{transform:scale(.94)}
.opts{display:flex;gap:12px;width:100%;justify-content:center;margin-top:8px}
.opt{flex:1;max-width:110px;min-height:96px;border-radius:20px;background:#fff;font-size:52px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.opt:active{background:#ffe9d9}
.q{font-size:22px;font-weight:600;margin:0 0 6px}
.say{font-size:20px;font-weight:600}

  background:rgba(255,244,224,.92);z-index:5;animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
/* parent panel */
.parent{border:2px dashed #b9a8d6;border-radius:16px;padding:10px;background:#fff}
.plabel{font-size:12px;font-weight:700;color:#6b5a8a;margin-bottom:8px;text-align:left;letter-spacing:.05em}
.prow{display:flex;gap:8px}
.pb{flex:1;min-height:56px;border-radius:14px;font-size:20px;font-weight:800;color:#fff}
.pb.ok{background:var(--ok)}.pb.no{background:#d9822b}
.pb:disabled{opacity:.3}
.hold{height:5px;border-radius:5px;background:#eee;margin:0 0 8px;overflow:hidden}

@keyframes fill{to{width:100%}}

label{display:block;font-size:15px;font-weight:600;margin:10px 0 4px;text-align:left}
select,textarea{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip.on{background:#ffe1ec;border-color:var(--btn2);font-weight:600}
.emojis{display:flex;gap:14px;justify-content:center;margin-top:10px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:6px 0 4px}
.tile{aspect-ratio:1;min-height:72px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:44px;font-weight:800;position:relative}
.tile.s1{background:#c9f0d9;border-color:var(--ok)}
.tile.s2{background:#ffe3a8;border-color:#e0a21a}
.tile.s2::after{content:"name";position:absolute;bottom:2px;left:0;right:0;font-size:11px;font-weight:600;color:#8a5f00}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
.low{color:#c0561b;font-weight:700}.good{color:#1f8f55;font-weight:700}
/* passages */
.passage{font-size:26px;line-height:1.75;font-weight:600;text-align:left;background:#fff;border-radius:18px;padding:16px;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pw{display:flex;flex-wrap:wrap;gap:6px;text-align:left;width:100%}

.step{display:flex;align-items:center;gap:10px;margin:10px 0}
.step button{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800}
/* multiple choice */
.mcqs{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}
.mcq{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 14px;border-radius:18px;background:#fff;

.mcq:active{background:#ffe9d9}
.mcq .em{font-size:34px}
.peek{background:#fff;border-radius:14px;padding:12px;margin-top:10px;font-size:18px;text-align:left;width:100%}
.peek[hidden]{display:none}
/* sequencing */
.slots{display:flex;flex-direction:column;gap:8px;width:100%;margin:8px 0}
.slot{min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.6);font-size:19px;text-align:left}
.slot b{font-size:22px;color:var(--btn2)}
.slot.big{font-size:34px}
.crow{display:flex;gap:8px;width:100%;margin-bottom:8px}
.crow .cd{flex:1;min-height:60px;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.1);font-size:19px;font-weight:600;padding:8px 12px;text-align:left}
.crow .cd.big{font-size:40px;text-align:center}
.crow .cs{min-width:52px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:22px}
.crow.used{opacity:.3;pointer-events:none}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
/* session 3: typing */
.optw{font-size:36px;max-width:150px}
.spin{width:100%;max-width:340px;min-height:64px;border:3px solid var(--line);border-radius:16px;padding:0 14px;font:inherit;font-size:34px;font-weight:600;text-align:center;background:#fff;color:var(--ink);margin:4px 0 6px}
.spin:focus,.wt:focus{outline:none;border-color:var(--btn)}
.wt{width:100%;min-height:150px;border:3px solid var(--line);border-radius:16px;padding:12px;font:inherit;font-size:22px;line-height:1.5;background:#fff;color:var(--ink);resize:vertical}
.toprow{display:flex;align-items:center;gap:8px;min-height:44px}
#back{min-width:72px;min-height:40px;padding:0 10px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.85);font-size:15px;font-weight:600;color:var(--muted)}
#back[hidden]{display:none}
body.kb #bottom{display:none}
.inl{margin-top:12px}
.pic{font-size:72px;letter-spacing:12px;margin:4px 0 8px}
/* session 4: training */
.m{color:var(--btn2);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.big{font-size:64px;font-weight:800;letter-spacing:.04em;margin:8px 0}
.magicbtn{min-height:64px;padding:0 22px;border-radius:20px;font-size:24px;font-weight:800;color:#fff;background:linear-gradient(135deg,#8a5cf6,#ff5a7a);box-shadow:0 6px 16px rgba(138,92,246,.35);margin:10px 0}
.pair{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pair button{min-width:120px;min-height:80px;border-radius:18px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);font-size:38px;font-weight:800}
.fb{font-size:20px;font-weight:600;margin:6px 0 10px}
.hl{background:#fff1a8;border-radius:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 10px}
.bank button{min-height:44px;padding:4px 14px;border-radius:22px;background:#fff;border:2px solid var(--line);font-size:19px;font-weight:600}
.tries{font-size:15px;color:var(--muted);margin-top:4px}
.line{min-height:64px;width:100%;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(255,255,255,.6);margin:8px 0}
.line span{font-size:21px;font-weight:600;padding:4px 8px;border-radius:10px;background:#fff}
.line span.and,.tiles button.and{color:var(--btn2)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.tiles button{min-height:52px;padding:4px 14px;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.1);font-size:21px;font-weight:600}
.tiles button.used{opacity:.25;pointer-events:none}
.keyl{font-size:96px;font-weight:800;line-height:1;margin:6px 0}
.word.phr{font-size:38px;line-height:1.25}
.rule{display:flex;flex-direction:column;gap:12px;width:100%;margin:8px 0}
.rule button{background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.1);padding:12px;text-align:center}
.rule .rw{font-size:52px;font-weight:800}
.rule .rt{font-size:18px;color:var(--muted);font-weight:600}
.keymsg{min-height:26px;font-size:18px;font-weight:600;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header id="top"><div class="toprow"><button id="back" type="button" hidden aria-label="Go back">‹ Back</button><div id="blk"></div></div><div id="bar"><i id="barfill"></i></div></header>
  <main id="main"></main>
  <footer id="bottom"></footer>
</div>

<script>
(() => {
"use strict";

/* ====================================================================
   Session 7 – Training 4: cold check (ai/ay, when/there/put), ee / ea, long-or-short check, could / would / should, tricky phrases
   schema deniz-session/1, kind "training".
   Training = feedback is shown after a mistake and she has another go.
   Scores always use her FIRST try (correct), retries are kept separately.
   ==================================================================== */
const KEY = "deniz-s07-v1";
const SESSION = 7;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now = () => new Date().toISOString();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s || "").trim().toLowerCase().replace(/[.!?,]+$/, "").replace(/\s+/g, " ");

/* ---------- speech ---------- */
let voice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /^en[-_]AU/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
try { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } catch (e) {}
function utter(text, rate) { const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice; u.lang = (voice && voice.lang) || "en-AU"; u.rate = rate || 0.85; return u; }
function say(text, rate) { try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); speechSynthesis.speak(utter(text, rate)); } catch (e) {} }
function sayList(arr, rate, onend, onstart) {
  try {
    if (!window.speechSynthesis) return false;
    speechSynthesis.cancel();
    arr.forEach((t, i) => { const u = utter(t, rate); if (onstart) u.onstart = () => onstart(i); if (onend && i === arr.length - 1) u.onend = onend; speechSynthesis.speak(u); });
    return true;
  } catch (e) { return false; }
}
function speechCancel() { try { speechSynthesis.cancel(); } catch (e) {} }

/* ---------- voice recording (stays on the phone until exported) ---------- */
let micStream = null;
const AUDIO = {};
async function initMic() {
  try { if (!navigator.mediaDevices || !window.MediaRecorder) return false; micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); return true; }
  catch (e) { micStream = null; return false; }
}
function recStart() {
  try {
    if (!micStream) return null;
    const mt = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    const mr = new MediaRecorder(micStream, mt ? { mimeType: mt } : undefined), chunks = [];
    mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    const done = new Promise(res => { mr.onstop = () => res(new Blob(chunks, { type: mr.mimeType || mt || "audio/webm" })); });
    mr.start(); return { mr, done };
  } catch (e) { return null; }
}
const audioExt = t => /mp4/.test(t) ? "m4a" : /ogg/.test(t) ? "ogg" : "webm";

/* ---------- wake lock ---------- */
async function wake() { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.started_at && !S.exported) wake(); });

/* ---------- state ---------- */
const fresh = () => ({ v: 1, pos: 0, steps: [], ctx: {}, started_at: null, feeling: null, obs: [], note: "", exported: false, endedEarly: false, draft: {} });
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.v === 1 ? s : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load() || fresh();

/* ====================================================================
   CONTENT
   ==================================================================== */
const VNAME = { a: "ay", e: "ee", i: "eye", o: "oh", u: "you" };
const isMagic = w => /^[a-z]*[aeiou][^aeiou]e$/.test(w);
// highlight the vowel and the final e in a magic-e word
const mark = w => isMagic(w) ? esc(w).replace(/([aeiou])([^aeiou])e$/, '<span class="m">$1</span>$2<span class="m">e</span>')
  : /ai|ay|ee|ea/.test(w) ? esc(w).replace(/(ai|ay|ee|ea)/, '<span class="m">$1</span>') : esc(w);
const aiTip = w => /ay/.test(w) ? "a y says ay. We use ay at the end of a word." : /ai/.test(w) ? "a i says ay. We use ai in the middle of a word."
  : /ee/.test(w) ? "e e says ee." : /ea/.test(w) ? "e a says ee." : "";
const magicTip = w => { const v = (w.match(/([aeiou])[^aeiou]e$/) || [])[1]; return v ? `The e is silent. It makes the ${v} say its name: ${VNAME[v]}.` : ""; };

// Keyboard game: see and hear a letter, find it on the keyboard (speed tracked over sessions)
const KEYS = ["e","s","c","f","g","o","u","j"].map(l => ({ prompt: l, expected: l, skills: ["hw6"] }));
// Cold check of last session, BEFORE any reminder: ai / ay (new words) and when / there / put
const COLD_READ = ["rail","say","paint","stay"].map(w => ({ prompt: w, expected: w, skills: ["ph5"] }));
const COLD_SPELL = [["tail","The dog wags its tail."],["say","What did you say?"]].map(a => ({ prompt: a[0], sentence: a[1], expected: a[0], skills: ["sp3"] }));
const COLD_TRICKY = [["when","wen","whn"],["there","thare","ther"],["put","poot","pud"]].map(a => ({ prompt: a[0], expected: a[0], options: a, skills: ["sp2"] }));
// Teach ee / ea: add a letter
const TEACH = [["fed","feed","e"],["ten","teen","e"],["met","meat","a"],["bet","beat","a"]].map(a => ({ prompt: a[0] + " → " + a[1], short: a[0], long: a[1], btn: "✨ Add " + a[2],
  tip: "e and " + a[2] + " together say ee: " + a[1] + ".", tipSay: "e " + a[2] + " says ee. " + a[1] + "." }));
const RULE = { title: "ee or ea?", q: "Both say “ee”. Learn the word families!",
  say: "e e and e a both say ee. There is no easy rule, so we learn the words. Tree, see, feet and green have e e. Sea, eat, read and beach have e a.",
  cards: [{ html: 'tr<span class="m">ee</span>', t: "tree · see · feet · green", speak: ["e e words", "tree", "see", "feet", "green"] },
          { html: 's<span class="m">ea</span>', t: "sea · eat · beach · team", speak: ["e a words", "sea", "eat", "beach", "team"] }] };
// Hear a word, choose ee or ea (no real-word pairs, so only one spelling is a word)
const HEAR = [["tree","trea"],["eat","eet"],["green","grean"],["sheep","sheap"],["leaf","leef"],["dream","dreem"]]
  .map(a => ({ prompt: a[0], expected: a[0], options: [a[0], a[1]], skills: ["ph5", "sp3"] }));
const READ = ["tree","seat","feet","eat","green","bed"].map(w => ({ prompt: w, expected: w, skills: ["ph5"] }));
const SPELL = [["tree","The bird is in the tree."],["eat","I like to eat apples."],["green","The grass is green."],["sea","We swim in the sea."],["feet","I have two feet."]]
  .map(a => ({ prompt: a[0], sentence: a[1], expected: a[0], skills: ["sp3"] }));
// Long or short? Pairs mixed up, so she has to check for magic e or a vowel team (she read fun as "fine")
const CHECK = ["fun","fine","hope","hop","ran","rain","bake","bag"].map(w => ({ prompt: w, expected: w, skills: ["ph4", "ph5"] }));
// New tricky words: one family
const TRICKY = [
  { w: "could",  html: 'c<span class="m">ould</span>', tip: "Could ends with o u l d. The l is silent. Could.", tipShow: "ould says /ood/, silent l" },
  { w: "would",  html: 'w<span class="m">ould</span>', tip: "Would is like could, with a w. Would.", tipShow: "like could, with a w" },
  { w: "should", html: 'sh<span class="m">ould</span>', tip: "Should is like could, with s h. Should.", tipShow: "like could, with sh" }
].map(t => Object.assign(t, { prompt: t.w, expected: t.w, skills: ["sp2", "fl1"] }));
// Tricky words inside phrases
const PHRASES = ["what is it", "put it on", "have a go", "there was a", "when can we", "could you see"].map(w => ({ prompt: w, expected: w, skills: ["fl5", "fl1"] }));
// Story: ee / ea + could
const STORY = { key: "beach", title: "At the beach",
  text: "Jean and her dad went to the beach. The sea was green and the sand was hot. Jean had a big red ball. “Could you kick it to me?” said Dad. Jean gave it a kick. It went up to a tree! Dad had to reach up to get it." };
STORY.words = STORY.text.split(/\s+/).map(raw => ({ raw, prompt: raw.replace(/[^A-Za-z'’-]/g, "").toLowerCase() }));
STORY.sents = STORY.text.match(/[^.!?]+[.!?]+[”"]?(\s+said \w+\.)?/g).map(s => s.trim());
const COMP = [["Where did Jean and Dad go?", [["To the beach","🏖️"],["To school","🏫"],["To the shop","🛒"]], "co6", "literal"],
              ["What colour was the sea?", [["Green","🟢"],["Red","🔴"],["Pink","🩷"]], "co6", "literal"],
              ["Why did Dad reach up?", [["The ball was in the tree","🌳"],["He wanted to swim","🌊"],["He was hot","☀️"]], "co7", "inference"]]
  .map(x => ({ prompt: x[0], expected: x[1][0][0], options: x[1].map(o => ({ t: o[0], e: o[1] })), skills: [x[2]], kind: x[3] }));
const BUILD = [["We","went","to","the","beach","and","we","had","fun."], ["First","we","ate","and","then","we","swam","in","the","sea."]]
  .map(w => ({ prompt: w.join(" "), expected: w.join(" "), words: w, skills: ["wr9", "wr8", "wr6"] }));

  prompt: "Finish the sentence. Use and or then to join two things you do at the beach.", picSay: "For example: At the beach I swim in the sea and then I eat a snack.",

function hold(ms) {

function updateBar(frac) {
  let done = 0; for (let i = 0; i < S.pos && i < flow.length; i++) done += flow[i].w || 0;
  const e = flow[S.pos]; if (e) done += (e.w || 0) * (frac || 0);

}
function stepRec(e) {
  let r = S.steps.find(x => x.id === e.id);
  if (!r) { r = { id: e.id, skills: e.skills, mode: e.mode, label: e.label, started_at: now(), duration_sec: 0, items: [], notes: e.note || "" }; S.steps.push(r); }
  return r;
}
const shown = r => r.items.filter(i => !i.notShown);
const scored = r => r.mode === "auto" || r.mode === "parent";
const itemScore = i => i.score != null ? i.score : (i.correct ? 1 : 0);
const isStep = e => e && e.kind === "step";
const recOf = id => S.steps.find(r => r.id === id);

function go() {
  if (S.pos >= flow.length) return;

  if (e.kind === "screen") { updateBar(0); e.render(() => { S.pos++; save(); go(); }); return; }

  if (rec.items.length >= e.items.length) { S.pos++; save(); return go(); }
  if (e.type === "passage") { updateBar(0); return renderPassage(e, rec); }
  updateBar(rec.items.length / e.items.length);
  ({ keys: renderKeys, build: renderBuild, pick: renderPick, teach: renderTeach, read: renderRead, spell: renderSpell, tricky: renderTricky, mcq: renderMCQ, write: renderWrite })[e.type](e, rec, rec.items.length);
}
function record(e, rec, item, after) {

  save(); after ? after() : go();
}

/* ---------- ‹ Back ---------- */
function popItem(e, r) {
  if (e.type === "passage") { const had = r.items.length > 0; r.items = []; ["read1", "read2", "level", "words", "errors", "accuracy", "seconds", "wcpm", "self_corrections", "behaviours"].forEach(k => delete r[k]);
    delete AUDIO[e.id + "-1"]; delete AUDIO[e.id + "-2"]; return had; }
  if (!r.items.length) return false;
  const it = r.items.pop();
  if (e.type === "write") S.draft[e.id] = { text: it.response || "", deletes: it.deletes || 0, ms: it.ms || 0 };
  return true;
}
function goBack() {
  if (lock || inBoot || S.pos <= 0) return;
  speechCancel();
  const e = flow[S.pos];
  if (isStep(e)) { const r = stepRec(e); if (e.type !== "passage" && popItem(e, r)) { save(); return go(); } }
  let p = S.pos - 1;
  while (p > 0 && isStep(flow[p])) { const r = recOf(flow[p].id); if (r && popItem(flow[p], r)) break; p--; }
  S.pos = Math.max(0, p); save(); go();
}

      `<button class="primary" data-act="done" id="doneBtn" disabled>Done ➜</button>`,
      { spk: speak, done: () => submit(retry) }, true);
    const inp = $("#sp"); trackEdits(inp, st);
    inp.addEventListener("input", () => { $("#doneBtn").disabled = !inp.value.trim(); });
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); submit(retry); } });
    if (retry) sayList([it.expected, it.expected.split("").join(", "), magicTip(it.expected) || aiTip(it.expected)].filter(Boolean), 0.8); else setTimeout(speak, 350);
  };
  const submit = retry => {
    const raw = $("#sp").value.trim(); if (!raw) return;
    const ok = norm(raw) === norm(it.expected);
    if (!retry) {
      first = raw; firstMs = Date.now() - t0;
      if (ok) return record(e, rec, { prompt: it.prompt, sentence: it.sentence, expected: it.expected, response: raw, correct: true, skills: it.skills, attempts: 1, ms: firstMs, deletes: st.deletes, skipped: false }, () => cheer(cheerMsg(), go));
      return view(true);
    }
    record(e, rec, { prompt: it.prompt, sentence: it.sentence, expected: it.expected, response: first, correct: false, retry_response: raw, retry_correct: ok,
      used_ck: /ck/.test(first), skills: it.skills, attempts: 2, ms: firstMs + (Date.now() - t0), deletes: st.deletes, skipped: false }, () => cheer(ok ? "⭐ Now you've got it!" : "⭐ Good try!", go));
  };
  view(false);
}

/* ---------- tricky words: look, say, cover, write, check ---------- */
function renderTricky(e, rec, idx) {
  const it = e.items[idx], tries = [], tStart = Date.now();
  const look = () => {
    screen(e.label, `${counter(e, idx)}<p class="q">Look at the tricky part. Say the word.</p><div class="big">${it.html}</div>
      <p class="fb">${esc(it.tipShow)}</p><button class="spk" data-act="spk">🔊</button>${tries.length ? `<div class="tries">Go ${tries.length + 1} of 3</div>` : ""}`,
      `<button class="primary" data-act="cover">🙈 Cover it and write</button>`,
      { spk: () => sayList([it.w, it.tip], 0.8), cover: () => { speechCancel(); write(); } });
    setTimeout(() => sayList([it.w, it.tip], 0.8), 300);
  };
  const write = () => {
    screen(e.label, `${counter(e, idx)}<p class="q">Now type the word you saw</p><div class="big" style="opacity:.15">???</div>
      <input class="spin" id="sp" ${INPUT_ATTRS} aria-label="Type the word">`,
      `<button class="primary" data-act="done" id="doneBtn" disabled>Check ➜</button>`, { done: check }, true);
    const inp = $("#sp"); inp.addEventListener("input", () => { $("#doneBtn").disabled = !inp.value.trim(); });
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); check(); } });
  };
  const check = () => {
    const raw = $("#sp").value.trim(); if (!raw) return;
    tries.push(raw); const ok = norm(raw) === it.w;
    const finish = () => record(e, rec, { prompt: it.w, expected: it.w, response: tries[0], responses: tries.slice(), correct: norm(tries[0]) === it.w, correct_final: ok,
      skills: it.skills, attempts: tries.length, ms: Date.now() - tStart, skipped: false }, () => cheer(ok ? (tries.length === 1 ? "⭐ First go!" : "⭐ You got it!") : "⭐ Good try!", go));
    if (ok || tries.length >= 3) return finish();
    screen(e.label, `<div class="emoji">💡</div><p class="fb">Almost! You wrote <b>${esc(raw)}</b>.</p><p class="q">Let's look again.</p><div class="big">${it.html}</div>`,
      `<button class="primary" data-act="again">Try again ➜</button>`, { again: look });
    say("Almost! Let's look again. " + it.w, 0.85);
  };
  look();
}

/* ---------- repeated reading: read 1, listen, read 2 ---------- */
function renderPassage(e, rec) {
  const p = STORY, words = p.words; let tStart = 0, tick = null, rh = null;
  const R = { 1: { bad: new Set(), sc: 0, secs: 0 }, 2: { bad: new Set(), sc: 0, secs: 0 } }, beh = new Set();
  const readView = n => {
    screen(p.title, `<p class="q">${n === 1 ? "Read the story out loud" : "Now read it again. You know it better now!"}</p><button class="spk" data-act="spk">🔊</button>
      <div class="passage">${esc(p.text)}</div>`,
      `<div class="parent"><div class="plabel">👤 PARENT – read ${n} of 2: tap Start when she begins, Stop when she finishes</div>
        <div class="prow"><button class="pb ok" data-act="tm" id="tbtn">▶ Start timer</button></div><div class="hint" id="tt" style="text-align:center"></div></div>`,
      { spk: () => say(n === 1 ? "Read the story out loud. Take your time." : "Read it again. You know it better now!"),
        tm: () => {
          if (!tStart) { speechCancel(); rh = recStart(); tStart = Date.now(); $("#tbtn").textContent = (rh ? "🎙 " : "") + "■ Stop – she finished"; $("#tbtn").className = "pb no";
            tick = setInterval(() => { const t = $("#tt"); if (t) t.textContent = Math.round((Date.now() - tStart) / 1000) + " s"; }, 500); }
          else { R[n].secs = (Date.now() - tStart) / 1000; clearInterval(tick); tStart = 0;
            if (rh) { const r = rh; rh = null; try { r.mr.stop(); } catch (x) {} r.done.then(b => { if (b && b.size) AUDIO[e.id + "-" + n] = { blob: b, seconds: Math.round(R[n].secs), mime: b.type }; }); }
            markView(n); }
        } }, true);
  };
  const markView = n => {
    const o = R[n], cnt = () => `${o.bad.size} word${o.bad.size === 1 ? "" : "s"} marked`;
    screen("Parent: mark words", `<h1 style="font-size:22px">👤 Read ${n}: tap the words she got wrong</h1>
      <p class="hint" style="margin-top:0">Tap any word she misread, couldn't read or left out. Don't tap words she fixed herself.</p>
      <div class="pw">${words.map((w, i) => `<button class="w" data-act="w" data-i="${i}">${esc(w.raw)}</button>`).join("")}</div>
      <div class="step"><span>Fixed herself:</span><button data-act="m">−</button><b id="sc">0</b><button data-act="pl">+</button></div>
      ${n === 2 ? `<div class="chips">${BEH.map(x => `<button class="chip" data-act="chip" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>` : ""}`,
      `<div class="hint" id="cnt" style="text-align:center;margin:0 0 6px">${cnt()}</div><button class="primary" data-act="save">${n === 1 ? "Save, then listen ➜" : "Save ➜"}</button>`,
      { w: b => { const i = +b.dataset.i; o.bad.has(i) ? o.bad.delete(i) : o.bad.add(i); b.classList.toggle("bad"); $("#cnt").textContent = cnt(); },
        m: () => { o.sc = Math.max(0, o.sc - 1); $("#sc").textContent = o.sc; }, pl: () => { o.sc++; $("#sc").textContent = o.sc; },
        chip: b => { const v = b.dataset.v; beh.has(v) ? beh.delete(v) : beh.add(v); b.classList.toggle("on"); },
        save: () => n === 1 ? modelView() : saveAll() }, true);
  };
  const modelView = () => {
    screen(p.title, `<p class="q">Listen and follow with your finger</p>
      <div class="passage">${p.sents.map((s, i) => `<span id="ps${i}">${esc(s)}</span>`).join(" ")}</div>`,
      `<div class="prow"><button class="ghost" data-act="play" style="flex:1">🔊 Listen again</button><button class="primary" data-act="next" id="nx" style="flex:1.4" disabled>My turn ➜</button></div>`,
      { play, next: () => { speechCancel(); readView(2); } }, true);
    play();
  };
  const play = () => {
    const hl = i => { p.sents.forEach((_, k) => { const el = $("#ps" + k); if (el) el.className = k === i ? "hl" : ""; }); };
    const ok = sayList(p.sents, 0.8, () => { hl(-1); const b = $("#nx"); if (b) b.disabled = false; }, hl);
    setTimeout(() => { const b = $("#nx"); if (b) b.disabled = false; }, ok ? 20000 : 0);
  };
  const stats = n => { const o = R[n], w = words.length, er = o.bad.size;
    return { errors: er, words: w, accuracy: Math.round((w - er) / w * 100), seconds: Math.round(o.secs), wcpm: o.secs > 0 ? Math.round((w - er) / (o.secs / 60)) : null,
      self_corrections: o.sc, misread: Array.from(o.bad).sort((a, b) => a - b).map(i => words[i].prompt) }; };
  const saveAll = () => {
    if (lock) return; lock = true;
    rec.items = words.map((w, i) => ({ prompt: w.prompt, expected: w.prompt, response: R[1].bad.has(i) ? "misread" : w.prompt, correct: !R[1].bad.has(i), attempts: 1, ms: null, skipped: false, skills: ["fl2"] }));
    rec.read1 = stats(1); rec.read2 = stats(2); rec.behaviours = Array.from(beh);
    Object.assign(rec, { level: "A", words: words.length, errors: rec.read1.errors, accuracy: rec.read1.accuracy, seconds: rec.read1.seconds, wcpm: rec.read1.wcpm, self_corrections: rec.read1.self_corrections });
    rec.duration_sec = rec.read1.seconds + rec.read2.seconds;
    save(); cheer("⭐ Well done!", go);
  };
  readView(1);
}

/* ---------- questions ---------- */
function renderMCQ(e, rec, idx) {
  const it = e.items[idx], opts = shuffle(it.options);
  const speakAll = () => sayList([it.prompt].concat(opts.map(o => o.t)), 0.85);

    <div class="mcqs">${opts.map((o, i) => `<button class="mcq" data-act="o" data-i="${i}"><span class="em">${o.e || ""}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`, "",
    { spk: speakAll, o: b => { const o = opts[+b.dataset.i];
      record(e, rec, { prompt: it.prompt, expected: it.expected, response: o.t, correct: o.t === it.expected, skills: it.skills, kind: it.kind, modality: "reading",
        attempts: 1, ms: Date.now() - t0, skipped: false }, () => cheer("⭐ Thanks!", go)); } }, true);

}

/* ---------- writing: one sentence with a word bank ---------- */
function textStats(txt) {
  const t = String(txt || "").trim(), words = t ? t.split(/\s+/).filter(Boolean) : [];
  return { chars: t.length, words: words.length, starts_with_capital: /^[A-Z]/.test(t), ends_with_punct: /[.!?]$/.test(t),
    lowercase_i: words.filter(w => w === "i").length, magic_e_words: t.toLowerCase().split(/[^a-z]+/).filter(isMagic), starts_with_given: true,
    joining_words: t.toLowerCase().split(/[^a-z]+/).filter(w => ["and", "but", "so", "because", "then", "when"].includes(w)), comma_without_space: (t.match(/,\S/g) || []).length };
}
function renderWrite(e, rec, idx) {
  const it = e.items[idx], d = S.draft[e.id] || (S.draft[e.id] = { text: it.start || "", deletes: 0, ms: 0 }), t1 = Date.now(), st = { deletes: 0 };
  const speakIt = () => sayList([it.prompt, it.picSay], 0.85);
  const commit = skipped => {
    const ta = $("#wt"); if (ta) d.text = ta.value;
    const txt = skipped ? "" : d.text.trim();
    record(e, rec, { prompt: it.prompt, kind: it.kind, pic: it.pic, response: skipped ? null : txt, correct: null, skills: it.skills, attempts: 1,
      ms: d.ms + (Date.now() - t1), deletes: d.deletes + st.deletes, stats: textStats(txt), skipped: !!skipped }, () => { delete S.draft[e.id]; save(); cheer("⭐ Great writing!", go); });
  };
  screen(e.label, `<div class="pic">${it.pic}</div><p class="q">${esc(it.prompt)}</p><button class="spk" data-act="spk">🔊</button>
    <div class="bank">${it.bank.map(w => `<button data-act="w" data-w="${w}">${mark(w)}</button>`).join("")}</div>
    <textarea class="wt" id="wt" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type here">${esc(d.text)}</textarea>`,
    `<button class="primary" data-act="done" id="doneBtn" disabled>Done ➜</button>
     <div style="text-align:center;margin-top:8px"><button class="ghost" data-act="skip" style="min-height:40px;font-size:14px">👤 Skip this one</button></div>`,
    { spk: speakIt, w: b => say(b.dataset.w, 0.8), done: () => { const v = $("#wt").value.trim(); if (v && v !== (it.start || "").trim()) commit(false); },
      skip: () => { if (confirm("Skip this one?")) commit(true); } }, true);
  const ta = $("#wt"); trackEdits(ta, st);
  const upd = () => { $("#doneBtn").disabled = !ta.value.trim() || ta.value.trim() === (it.start || "").trim(); };
  ta.addEventListener("input", () => { d.text = ta.value; upd(); save(); }); upd();
  if (!d.text || d.text === it.start) setTimeout(speakIt, 350);
}

/* ---------- keyboard game: one text box for all letters, so the keyboard stays open ---------- */
function renderKeys(e, rec, idx) {
  let i = idx, tries = 0, tL = 0;
  screen(e.label, `<p class="q">Find the letter on the keyboard!</p><div class="count" id="kc"></div><div class="keyl" id="kl"></div>
    <button class="spk" data-act="spk">🔊</button><input class="spin" id="sp" ${INPUT_ATTRS} aria-label="Type the letter" placeholder="tap here">
    <div class="keymsg" id="km">Tap the box to open the keyboard.</div><p class="hint" style="text-align:center">The keyboard shows capital letters. Both are the same key.</p>`, "", { spk: () => say("Find " + e.items[i].prompt, 0.8) }, true);
  const inp = $("#sp");
  const show = () => { $("#kc").textContent = (i + 1) + " of " + e.items.length; $("#kl").textContent = e.items[i].prompt.toUpperCase() + " " + e.items[i].prompt; tries = 0; tL = Date.now(); say("Find " + e.items[i].prompt, 0.8); updateBar(i / e.items.length); };
  inp.addEventListener("focus", () => { if (!tL) { $("#km").textContent = ""; tL = Date.now(); } }, { once: true });
  inp.addEventListener("input", () => {
    const ch = inp.value.slice(-1).toLowerCase(); inp.value = ""; if (!ch) return;
    const it = e.items[i]; tries++;
    if (ch !== it.expected) { $("#km").textContent = "Try again! 🔍"; return; }
    rec.items.push({ prompt: it.prompt, expected: it.expected, response: it.expected, correct: tries === 1, attempts: tries, ms: Date.now() - tL, skills: it.skills, skipped: false });
    rec.duration_sec = Math.round(rec.items.reduce((a, x) => a + (x.ms || 0), 0) / 1000); save();
    $("#km").textContent = "⭐"; i++;
    if (i >= e.items.length) { inp.blur(); return cheer("⭐ Fast fingers!", go); }
    show();
  });
  show(); tL = 0; speechCancel(); setTimeout(() => say("Find " + e.items[i].prompt + ". Tap the box to open the keyboard.", 0.85), 350);
}

/* ---------- build a sentence from word tiles ---------- */
function renderBuild(e, rec, idx) {
  const it = e.items[idx]; let tiles = shuffle(it.words.map((t, k) => ({ t, k })));
  let g = 0; while (tiles.every((x, k) => x.k === k) && g++ < 10) tiles = shuffle(tiles);
  let order = [];
  const cls = w => /^(and|then)$/i.test(w) ? "and" : "";
  const view = () => {
    $("#main").innerHTML = `${counter(e, idx)}<p class="q">Tap the words in order</p><button class="spk" data-act="spk">🔊</button>
      <div class="line">${order.map(k => `<span class="${cls(tiles[k].t)}">${esc(tiles[k].t)}</span>`).join("")}</div>
      <div class="tiles">${tiles.map((x, k) => `<button class="${cls(x.t)}${order.includes(k) ? " used" : ""}" data-act="pick" data-k="${k}">${esc(x.t)}</button>`).join("")}</div>
      <button class="ghost" data-act="reset">↺ Start again</button>`;
    const nb = $("#nextBtn"); if (nb) nb.disabled = order.length < tiles.length;
  };
  screen(e.label, "", `<button class="primary" id="nextBtn" data-act="sub" disabled>Done ➜</button>`, {
    spk: () => say(it.prompt, 0.8),
    pick: b => { const k = +b.dataset.k; if (!order.includes(k)) { order.push(k); view(); } },
    reset: () => { order = []; view(); },
    sub: () => {
      if (order.length < tiles.length) return;
      const resp = order.map(k => tiles[k].t).join(" "), ok = resp === it.expected;
      record(e, rec, { prompt: it.prompt, expected: it.expected, response: resp, correct: ok, skills: it.skills, attempts: 1, ms: Date.now() - t0, skipped: false },
        () => ok ? cheer("⭐ Great sentence!", go) : showMe(e.label, `<span style="font-size:26px;line-height:1.5;letter-spacing:0;font-weight:700">${it.words.map(w => `<span class="${cls(w) ? "m" : ""}">${esc(w)}</span>`).join(" ")}</span>`,
          [it.prompt], "Here's the sentence. <b>and</b> and <b>then</b> join two ideas.", go));
    }
  }, true);
  view();
  setTimeout(() => say(it.prompt, 0.8), 350);
}

/* ====================================================================
   RESULT + SUMMARY
   ==================================================================== */
const tallyItems = s => { const c = s.reduce((a, i) => a + itemScore(i), 0); return { correct: Math.round(c * 2) / 2, total: s.length, pct: s.length ? Math.round(c / s.length * 100) : null }; };
const tally = r => r && scored(r) ? tallyItems(shown(r)) : { correct: 0, total: 0, pct: null };
function computeSummary(steps) {
  const get = id => steps.find(r => r.id === id);
  const misreadOf = r => r ? shown(r).filter(i => !i.correct).map(i => i.prompt + (i.response && i.response !== i.prompt ? " (said " + i.response + ")" : "")) : [];
  const spellOf = r => { const I = r ? shown(r) : [];
    return { first: Object.assign(tallyItems(I), { misspelt: I.filter(i => !i.correct).map(i => ({ expected: i.expected, response: i.response, retry: i.retry_response, retry_correct: i.retry_correct })) }),
             after: tallyItems(I.map(i => ({ correct: i.correct || !!i.retry_correct }))), ck: I.filter(i => !i.correct && /ck/.test(i.response || "")).length }; };
  const kr = get("s7-keys"), kI = kr ? shown(kr) : [];
  const kms = kI.map(i => i.ms).filter(x => x != null).sort((a, b) => a - b);
  const keys = Object.assign(tallyItems(kI), { median_ms: kms.length ? kms[Math.floor(kms.length / 2)] : null, slowest: kI.slice().sort((a, b) => b.ms - a.ms).slice(0, 3).map(i => i.prompt + " " + Math.round(i.ms / 100) / 10 + "s") });
  const cold_read = Object.assign(tally(get("s7-cold-read")), { misread: misreadOf(get("s7-cold-read")) });
  const cs = spellOf(get("s7-cold-spell")), cold_spell = Object.assign(cs.first, { ck: cs.ck });
  const hear = tally(get("s7-hear")), read = Object.assign(tally(get("s7-read")), { misread: misreadOf(get("s7-read")) });
  const sp = spellOf(get("s7-spell")), spell = sp.first, spell_after = sp.after;
  const review = tally(get("s7-cold-tricky")), comp = tally(get("s7-comp"));
  const phrases = Object.assign(tally(get("s7-phrases")), { not_smooth: misreadOf(get("s7-phrases")) });
  const cr = get("s7-check"), cI = cr ? shown(cr) : [], isLong = w => isMagic(w) || /ai|ay|ee|ea/.test(w);
  const check = Object.assign(tallyItems(cI), { misread: misreadOf(cr), short_wrong: cI.filter(i => !i.correct && !isLong(i.prompt)).map(i => i.prompt), long_wrong: cI.filter(i => !i.correct && isLong(i.prompt)).map(i => i.prompt) });
  const br = get("s7-build"), build = Object.assign(tally(br), { responses: br ? shown(br).map(i => i.response) : [] });
  const tr = get("s7-tricky"), trI = tr ? shown(tr) : [];
  const tricky = Object.assign(tallyItems(trI), { final_correct: trI.filter(i => i.correct_final).length, tries: trI.map(i => ({ word: i.expected, responses: i.responses })) });
  const st = get("s7-read-beach");
  const story = st && st.read1 ? { read1: st.read1, read2: st.read2, behaviours: st.behaviours, gain_wcpm: st.read1.wcpm != null && st.read2.wcpm != null ? st.read2.wcpm - st.read1.wcpm : null } : null;
  const wr = get("s7-write"), wi = wr && wr.items[0];
  const writing = wi ? { text: wi.response, stats: wi.stats, ms: wi.ms } : null;
  const flags = [];
  if (S.ctx && S.ctx.predictive_off !== "yes") flags.push("Predictive text may have been on: some spellings may not be her own.");
  if (cold_read.total) flags.push("Remembered ai / ay without a reminder: reading " + cold_read.correct + "/" + cold_read.total + ", spelling " + cold_spell.correct + "/" + cold_spell.total + ".");
  const ck = cs.ck + sp.ck; if (ck) flags.push("Used ck instead of magic e in " + ck + " spelling" + (ck === 1 ? "" : "s") + " on the first try.");
  if (spell.total && spell_after.correct > spell.correct) flags.push("ee / ea spelling went from " + spell.correct + "/" + spell.total + " to " + spell_after.correct + "/" + spell.total + " after seeing the word.");
  if (story && story.gain_wcpm != null) flags.push("Story pace " + story.read1.wcpm + " → " + story.read2.wcpm + " words per minute after listening (" + (story.gain_wcpm >= 0 ? "+" : "") + story.gain_wcpm + ").");
  if (story && story.read1.seconds < 4) flags.push("Story timer looks too short to be real.");
  if (writing && writing.text && !(writing.stats.joining_words || []).includes("and")) flags.push("Her sentence didn't use 'and'.");
  if (check.short_wrong.length) flags.push("Long-or-short: read short words wrong (" + check.short_wrong.join(", ") + "), probably giving them the long sound.");
  if (S.ctx && S.ctx.record === "yes" && story && !Object.keys(AUDIO).length) flags.push("Recordings were lost (the page was probably reloaded). The scores are fine.");
  if (S.endedEarly) flags.push("Finished early at a break.");
  const acc = {}, evidence = [];
  steps.filter(scored).forEach(r => {
    const per = {};
    shown(r).forEach(i => (i.skills || r.skills).forEach(k => { const o = per[k] || (per[k] = { c: 0, t: 0 }); o.c += itemScore(i); o.t += 1; }));
    Object.keys(per).forEach(k => { const a = acc[k] || (acc[k] = { correct: 0, total: 0 }); a.correct += per[k].c; a.total += per[k].t;
      evidence.push({ skill: k, session: SESSION, step: r.id, correct: Math.round(per[k].c * 2) / 2, total: per[k].t, note: r.notes || "" }); });
  });
  const suggested_progress = {};
  Object.keys(acc).forEach(k => { const p = acc[k].correct / acc[k].total * 100;
    suggested_progress[k] = { status: p < 50 ? "not_yet" : "learning", likely_secure: p >= 90, correct: Math.round(acc[k].correct * 2) / 2, total: acc[k].total, pct: Math.round(p) }; });
  return { keys, cold_read, cold_spell, hear, read, spell, spell_after, ck_instead_of_e: ck, review, tricky, phrases, check, story, comp, build, writing, flags, suggested_progress, evidence,
    caveat: "Training session: scores are first tries. The cold check (s7-cold-*) is the retention test for the previous session (ai/ay, when/there/put)." };
}
function buildResult() {
  S.note = ($("#note") && $("#note").value) || S.note || "";
  const steps = S.steps.map(r => {
    const t = tally(r);
    const o = { id: r.id, skills: r.skills, mode: r.mode, started_at: r.started_at, duration_sec: r.duration_sec || 0, items: r.items,
      score: scored(r) ? { correct: t.correct, total: t.total } : null, notes: r.notes };
    if (r.read1) Object.assign(o, { level: r.level, words: r.words, errors: r.errors, accuracy: r.accuracy, seconds: r.seconds, wcpm: r.wcpm, self_corrections: r.self_corrections, read1: r.read1, read2: r.read2, behaviours: r.behaviours });
    return o;
  });
  const fin = now();
  const res = { schema: "deniz-session/1", session: SESSION, kind: "training", title: "Training 4 – ee / ea + long-or-short + could / would / should", focus: ["ph5", "ph4", "sp3", "sp2", "fl5", "wr9", "hw6"],
    started_at: S.started_at, finished_at: fin, duration_sec: Math.round((Date.parse(fin) - Date.parse(S.started_at || fin)) / 1000),
    device: navigator.userAgent, parent_context: S.ctx, steps, child_feeling: S.feeling, parent_note: S.note, observations: S.obs, summary: computeSummary(steps) };
  if (S.endedEarly) res.ended_early = true;
  res.recordings = Object.keys(AUDIO).map(id => ({ step: id, file: "session-07-" + id.replace("s7-", "") + "." + audioExt(AUDIO[id].mime), seconds: AUDIO[id].seconds, mime: AUDIO[id].mime, bytes: AUDIO[id].blob.size }));
  return res;
}
async function exportJson() {
  const res = buildResult(); save();
  const file = new File([JSON.stringify(res, null, 2)], "session-07-result.json", { type: "application/json" });
  const audio = res.recordings.map(r => new File([AUDIO[r.step].blob], r.file, { type: AUDIO[r.step].mime || "audio/webm" }));
  const files = [file].concat(audio), msg = $("#msg");
  try { if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, title: "Deniz – session 7 result" }); S.exported = true; save(); msg.textContent = "Shared ✓" + (audio.length ? " (with " + audio.length + " recordings)" : ""); return; } }
  catch (e) { if (e && e.name === "AbortError") return; }
  try {
    files.forEach((f, i) => setTimeout(() => { const url = URL.createObjectURL(f), a = document.createElement("a"); a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000); }, i * 700));
    S.exported = true; save(); msg.textContent = "Saved to Downloads ✓" + (audio.length ? " (results + " + audio.length + " recordings)" : "");
  } catch (e) { msg.textContent = "Could not save. Try Copy."; }
}

/* ====================================================================
   BOOT
   ==================================================================== */
function boot() {
  if (S.pos > 1 && S.pos < flow.length) {
    inBoot = true;
    screen("Parent", `<div class="emoji">💾</div><h1 style="font-size:24px">Session in progress</h1><p class="muted">Your answers are saved. Pick up where you stopped?</p>`,
      `<button class="primary" data-act="cont">Continue ➜</button>
       <div style="text-align:center;margin-top:14px"><button class="ghost" data-act="restart" style="min-height:36px;font-size:13px;border:0;background:none;text-decoration:underline">Start over (erases answers)</button></div>`,
      { cont: async () => { inBoot = false; if (S.ctx && S.ctx.record === "yes") await initMic(); wake(); go(); },
        restart: () => { if (confirm("Start over? ALL saved answers will be erased.") && confirm("Are you sure? This cannot be undone.")) { inBoot = false; S = fresh(); save(); go(); } } });
    return;
  }
  go();
}
if (location.hash === "#test") window.__s7 = { get S() { return S; }, buildResult, flow, STORY };
boot();
})();
